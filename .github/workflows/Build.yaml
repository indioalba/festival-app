name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_apk:
    name: "Local tests and APKs"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check spotless
        run: ./gradlew spotlessCheck

      - name: Check Dependency Guard
        run: ./gradlew :app:dependencyGuard

      - name: Update Graphs
        run: ./gradlew graphUpdate

      - name: Run all local screenshot tests (Roborazzi)
        run: ./gradlew :app:verifyRoborazziDemoDebug

      - name: Run local tests
        run: ./gradlew :app:testDemoDebugUnitTest

      - name: Build APKs
        run: ./gradlew :app:assembleDemoDebug

      - name: Check badging
        run: ./gradlew checkProdReleaseBadging

  androidTest:
    name: "Instrumented Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      matrix:
        api-level: [26, 34]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDemoDebugAndroidTest
